name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux unit, contract, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run docs:build

  linux-e2e:
    name: Linux container E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/linux/Dockerfile -t ios-sim-linux-test .
      - run: docker run --rm ios-sim-linux-test

  macos:
    name: macOS unit, contract, build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: Show simulator environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes || true
      # Real-simulator integration is run manually or on a dedicated macOS host:
      #   IOS_SIM_MACOS_TESTS=1 bun run test:macos
      # Runners do not reliably have a booted iOS 26.x runtime.
