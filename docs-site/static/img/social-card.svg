<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">iOS Sim Bridge — a real iOS Simulator, streamed to Linux</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#131b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="80" y="250" fill="#e7eaf2" font-family="system-ui, sans-serif" font-size="64" font-weight="700">iOS Sim Bridge</text>
  <text x="80" y="320" fill="#8b93a7" font-family="system-ui, sans-serif" font-size="30">A real iOS Simulator, streamed to Linux.</text>
  <rect x="80" y="380" width="420" height="8" rx="4" fill="url(#accent)"/>
</svg>
